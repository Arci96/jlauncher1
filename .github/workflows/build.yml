name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen (aus dem Tag, z. B. v1.2.3 -> 1.2.3)
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -Dapp.version=${{ steps.ver.outputs.version }} package
      - uses: actions/upload-artifact@v4
        with:
          name: JLauncher-jar
          path: target/JLauncher.jar

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          $v = '1.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT
          # Der Windows-Installer erlaubt nur Zahlen (z. B. 1.2.3)
          $n = '1.0.0'
          if ($v -match '^\d+(\.\d+){0,2}') { $n = $Matches[0] }
          "numeric=$n" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        shell: pwsh
        run: mvn -B "-Dapp.version=${{ steps.ver.outputs.version }}" package
      - name: WiX Toolset bereitstellen (für den .exe-Installer)
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Directory | Select-Object -First 1
          }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Installer bauen (jpackage)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/dist | Out-Null
          Copy-Item target/JLauncher.jar target/dist/
          jpackage `
            --type exe `
            --name JLauncher `
            --app-version "${{ steps.ver.outputs.numeric }}" `
            --vendor JLauncher `
            --description "Minecraft-Launcher" `
            --input target/dist `
            --main-jar JLauncher.jar `
            --main-class mclauncher.Main `
            --icon packaging/icon.ico `
            --dest target/installer `
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.xml,jdk.crypto.ec,jdk.localedata,jdk.management,jdk.unsupported `
            --win-menu --win-menu-group JLauncher --win-shortcut --win-dir-chooser --win-per-user-install `
            --win-upgrade-uuid 7f0b6a3e-4c1d-4e5a-9b2f-3d8c1a6e5b40
          Get-ChildItem target/installer
      - uses: actions/upload-artifact@v4
        with:
          name: JLauncher-installer
          path: target/installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [jar, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/JLauncher-jar/JLauncher.jar
            artifacts/JLauncher-installer/*.exe
